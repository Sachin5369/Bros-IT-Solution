<app-navbar></app-navbar>



<section class="section" id="industries" style="background:var(--card);border-top:1px solid var(--border);border-bottom:1px solid var(--border);">
  <div class="container">
    <div class="text-center mb-5" data-aos="fade-up">
      <span class="eyebrow">Industry Solutions</span>
      <h2 class="section-title">Tailored for your kind of business</h2>
      <p class="section-sub mx-auto">Purpose-built workflows for the industries we know best.</p>
    </div>
    <div class="row g-4">
      <div class="col-sm-6 col-lg-3" data-aos="fade-up" [attr.data-aos-delay]="(i % 4) * 70" *ngFor="let s of solutions; let i = index">
        <div class="solution-card">
          <div class="solution-img" [style.background]="'linear-gradient(135deg,' + s[1] + '22,' + s[1] + '08)'">
            <i [attr.data-lucide]="s[0]" style="width:44px;height:44px;" [style.color]="s[1]"></i>
          </div>
          <div class="solution-body">
            <h5>{{ s[2] }}</h5>
            <p>{{ s[3] }}</p>
            <a href="#" class="link-arrow">Learn More <i data-lucide="arrow-right" style="width:14px;height:14px"></i></a>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
